<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple calculator built with HTML, CSS, and JavaScript.">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <output id="display" class="display" aria-live="polite" aria-atomic="true">0</output>
    <div class="keypad" aria-label="Calculator keys">
      <button class="utility" data-action="clear" type="button">AC</button>
      <button class="utility" data-action="delete" type="button" aria-label="Delete last digit">DEL</button>
      <button class="operator" data-operator="/" type="button" aria-label="Divide">÷</button>
      <button class="operator" data-operator="*" type="button" aria-label="Multiply">×</button>

      <button type="button" data-number="7">7</button>
      <button type="button" data-number="8">8</button>
      <button type="button" data-number="9">9</button>
      <button class="operator" data-operator="-" type="button" aria-label="Subtract">−</button>

      <button type="button" data-number="4">4</button>
      <button type="button" data-number="5">5</button>
      <button type="button" data-number="6">6</button>
      <button class="operator" data-operator="+" type="button" aria-label="Add">+</button>

      <button type="button" data-number="1">1</button>
      <button type="button" data-number="2">2</button>
      <button type="button" data-number="3">3</button>
      <button class="equals" data-action="equals" type="button">=</button>

      <button class="zero" type="button" data-number="0">0</button>
      <button type="button" data-action="decimal">.</button>
    </div>
  </main>
</body>
</html>
